<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RefiGo Portal - Gestión Avanzada de Candidatos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS para Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .dropdown-menu { display: none; }
        .dropdown-menu.active { display: block; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-lg text-white font-bold text-xl">
                    <i class="fa-solid fa-users-viewfinder"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">RefiGo Portal</h1>
                    <p class="text-xs text-slate-400">Control de Candidatos y Filtros Tipo Excel</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <button onclick="openAddModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold px-4 py-2 rounded-lg transition duration-200 flex items-center space-x-2 shadow-lg shadow-emerald-600/30">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>+ Nuevo Candidato</span>
                </button>
                <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold px-4 py-2 rounded-lg transition duration-200 flex items-center space-x-2 shadow-lg shadow-indigo-600/30">
                    <i class="fa-solid fa-file-import"></i>
                    <span>Cargar Excel</span>
                    <input type="file" id="excelInput" accept=".xlsx, .xls" class="hidden">
                </label>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full space-y-6">

        <!-- Métricas Principales -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-slate-800 border border-slate-700/60 rounded-xl p-4 shadow-sm">
                <span class="text-xs font-semibold uppercase text-slate-400">Total Candidatos</span>
                <div id="metricTotal" class="text-2xl font-bold text-white mt-1">0</div>
            </div>
            <div class="bg-slate-800 border border-slate-700/60 rounded-xl p-4 shadow-sm">
                <span class="text-xs font-semibold uppercase text-slate-400">Referred</span>
                <div id="metricReferred" class="text-2xl font-bold text-emerald-400 mt-1">0</div>
            </div>
            <div class="bg-slate-800 border border-slate-700/60 rounded-xl p-4 shadow-sm">
                <span class="text-xs font-semibold uppercase text-slate-400">Cold</span>
                <div id="metricCold" class="text-2xl font-bold text-sky-400 mt-1">0</div>
            </div>
            <div class="bg-slate-800 border border-slate-700/60 rounded-xl p-4 shadow-sm">
                <span class="text-xs font-semibold uppercase text-slate-400">Rejected / No Ref.</span>
                <div id="metricOther" class="text-2xl font-bold text-rose-400 mt-1">0</div>
            </div>
        </div>

        <!-- Pestañas de Navegación Segmentadas -->
        <div class="border-b border-slate-700 flex space-x-2">
            <button class="tab-btn py-2.5 px-4 text-sm font-medium text-indigo-400 border-b-2 border-indigo-500 active" data-sheet="ALL">Todas las Categorías</button>
            <button class="tab-btn py-2.5 px-4 text-sm font-medium text-slate-400 hover:text-slate-200" data-sheet="Referred">Referred</button>
            <button class="tab-btn py-2.5 px-4 text-sm font-medium text-slate-400 hover:text-slate-200" data-sheet="Cold">Cold</button>
            <button class="tab-btn py-2.5 px-4 text-sm font-medium text-slate-400 hover:text-slate-200" data-sheet="Rejected by CONCENTRIX">Rejected</button>
            <button class="tab-btn py-2.5 px-4 text-sm font-medium text-slate-400 hover:text-slate-200" data-sheet="No Referred">No Referred</button>
        </div>

        <!-- Barra de Búsqueda y Limpieza -->
        <div class="flex items-center justify-between gap-4">
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
                <input type="text" id="globalSearch" placeholder="Buscar texto general..." 
                       class="w-full bg-slate-800 border border-slate-700 text-sm text-slate-100 rounded-lg pl-10 pr-4 py-2 focus:outline-none focus:border-indigo-500 transition">
            </div>
            <button id="clearAllFiltersBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg border border-slate-700 transition flex items-center gap-2">
                <i class="fa-solid fa-filter-circle-xmark"></i>
                <span>Limpiar Filtros</span>
            </button>
        </div>

        <!-- Tabla Principal con Filtros y Menú de Opciones -->
        <div class="bg-slate-800 border border-slate-700/60 rounded-xl shadow-xl overflow-visible relative">
            <div class="overflow-x-auto min-h-[400px]">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-900/80 text-slate-300 font-semibold border-b border-slate-700 text-xs uppercase">
                            <th class="py-3 px-4">Nombre / Referido</th>
                            <th class="py-3 px-4">Contacto</th>

                            <!-- Pestaña -->
                            <th class="py-3 px-4 relative">
                                <div class="flex items-center justify-between cursor-pointer" onclick="toggleDropdown('sheetFilter')">
                                    <span>Pestaña</span>
                                    <i class="fa-solid fa-filter text-slate-500 hover:text-white"></i>
                                </div>
                                <div id="sheetFilter" class="dropdown-menu absolute left-0 top-full mt-1 bg-slate-800 border border-slate-700 rounded-lg shadow-2xl p-3 w-56 z-50 normal-case">
                                    <button onclick="sortData('sheet', 'asc')" class="w-full text-left text-xs py-1 hover:text-indigo-400 block"><i class="fa-solid fa-arrow-down-a-z mr-1"></i> Sort A to Z</button>
                                    <button onclick="sortData('sheet', 'desc')" class="w-full text-left text-xs py-1 hover:text-indigo-400 block mb-2"><i class="fa-solid fa-arrow-up-z-a mr-1"></i> Sort Z to A</button>
                                    <hr class="border-slate-700 my-2">
                                    <input type="text" onkeyup="filterMenuOptions('sheetFilter', this.value)" placeholder="Search..." class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-xs mb-2">
                                    <div class="max-h-36 overflow-y-auto space-y-1 text-xs" id="sheetOptions"></div>
                                    <button onclick="applyColumnFilter('sheet')" class="mt-2 w-full bg-indigo-600 text-white text-xs py-1 rounded">OK</button>
                                </div>
                            </th>

                            <!-- Estatus -->
                            <th class="py-3 px-4 relative">
                                <div class="flex items-center justify-between cursor-pointer" onclick="toggleDropdown('statusFilter')">
                                    <span>Estatus</span>
                                    <i class="fa-solid fa-filter text-slate-500 hover:text-white"></i>
                                </div>
                                <div id="statusFilter" class="dropdown-menu absolute left-0 top-full mt-1 bg-slate-800 border border-slate-700 rounded-lg shadow-2xl p-3 w-60 z-50 normal-case">
                                    <button onclick="sortData('status', 'asc')" class="w-full text-left text-xs py-1 hover:text-indigo-400 block"><i class="fa-solid fa-arrow-down-a-z mr-1"></i> Sort A to Z</button>
                                    <button onclick="sortData('status', 'desc')" class="w-full text-left text-xs py-1 hover:text-indigo-400 block mb-2"><i class="fa-solid fa-arrow-up-z-a mr-1"></i> Sort Z to A</button>
                                    <hr class="border-slate-700 my-2">
                                    <input type="text" onkeyup="filterMenuOptions('statusFilter', this.value)" placeholder="Search..." class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-xs mb-2">
                                    <div class="max-h-36 overflow-y-auto space-y-1 text-xs" id="statusOptions"></div>
                                    <button onclick="applyColumnFilter('status')" class="mt-2 w-full bg-indigo-600 text-white text-xs py-1 rounded">OK</button>
                                </div>
                            </th>

                            <!-- Follow up? -->
                            <th class="py-3 px-4 relative">
                                <div class="flex items-center justify-between cursor-pointer" onclick="toggleDropdown('followUpFilter')">
                                    <span>Follow up?</span>
                                    <i class="fa-solid fa-filter text-slate-500 hover:text-white"></i>
                                </div>
                                <div id="followUpFilter" class="dropdown-menu absolute left-0 top-full mt-1 bg-slate-800 border border-slate-700 rounded-lg shadow-2xl p-3 w-60 z-50 normal-case">
                                    <button onclick="sortData('followUp', 'asc')" class="w-full text-left text-xs py-1 hover:text-indigo-400 block"><i class="fa-solid fa-arrow-down-a-z mr-1"></i> Sort A to Z</button>
                                    <button onclick="sortData('followUp', 'desc')" class="w-full text-left text-xs py-1 hover:text-indigo-400 block mb-2"><i class="fa-solid fa-arrow-up-z-a mr-1"></i> Sort Z to A</button>
                                    <hr class="border-slate-700 my-2">
                                    <input type="text" onkeyup="filterMenuOptions('followUpFilter', this.value)" placeholder="Search..." class="w-full bg-slate-900 border border-slate-700 rounded p-1 text-xs mb-2">
                                    <div class="max-h-36 overflow-y-auto space-y-1 text-xs" id="followUpOptions"></div>
                                    <button onclick="applyColumnFilter('followUp')" class="mt-2 w-full bg-indigo-600 text-white text-xs py-1 rounded">OK</button>
                                </div>
                            </th>

                            <th class="py-3 px-4">Notas / Seguimiento</th>
                            <th class="py-3 px-4 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-700/50 text-slate-200">
                        <!-- Carga dinámica -->
                    </tbody>
                </table>
            </div>
            <div class="px-4 py-3 bg-slate-900/40 border-t border-slate-700 text-xs text-slate-400 flex justify-between items-center">
                <span>Mostrando <strong id="visibleCount" class="text-slate-200">0</strong> registros de <strong id="totalCount" class="text-slate-200">0</strong></span>
            </div>
        </div>

    </main>

    <!-- Modal Agregar / Editar Candidato -->
    <div id="candidateModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="font-bold text-lg text-white" id="modalTitle">Nuevo Candidato</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-3 text-sm">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Nombre Completo</label>
                    <input type="text" id="inputName" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Correo</label>
                        <input type="email" id="inputEmail" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Número (Prefijo +503)</label>
                        <input type="text" id="inputPhone" placeholder="+503 " class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Pestaña</label>
                        <select id="inputSheet" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white text-xs">
                            <option value="Referred">Referred</option>
                            <option value="Cold">Cold</option>
                            <option value="Rejected by CONCENTRIX">Rejected</option>
                            <option value="No Referred">No Referred</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Estatus</label>
                        <input type="text" id="inputStatus" placeholder="Ej: Submitted" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Follow up?</label>
                        <input type="text" id="inputFollowUp" placeholder="Ej: Callback" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-white text-xs">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Notas / Detalle</label>
                    <textarea id="inputNotes" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-indigo-500"></textarea>
                </div>
            </div>
            <div class="flex justify-end space-x-2 border-t border-slate-700 pt-3">
                <button onclick="saveCandidate()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs px-4 py-2 rounded-lg flex items-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span>Guardar en Nube</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, deleteDoc, writeBatch 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD-VUDwirU710VYTQj05VF9vFIU7LPlwz0",
            authDomain: "refigo-portal.firebaseapp.com",
            projectId: "refigo-portal",
            storageBucket: "refigo-portal.firebasestorage.app",
            messagingSenderId: "238267359565",
            appId: "1:238267359565:web:af6c8232bb2ff9efffd704",
            measurementId: "G-6ERPBLGPNQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const candidatesCol = collection(db, "candidates");

        let allCandidates = [];
        let activeTabSheet = 'ALL';
        let currentEditingDocId = null;

        let columnFilters = { sheet: [], status: [], followUp: [] };

        // Escuchar Firebase en Vivo
        onSnapshot(candidatesCol, (snapshot) => {
            allCandidates = [];
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                allCandidates.push({
                    docId: docSnap.id,
                    sheet: data.sheet || 'No Referred',
                    name: data.name || 'Sin Nombre',
                    email: data.email || '-',
                    phone: data.phone || '-',
                    status: data.status || '-',
                    followUp: data.followUp || data['Follow up?'] || '-',
                    notes: data.notes || '-',
                    createdAt: data.createdAt || data.updatedAt || null,
                    updatedAt: data.updatedAt || null
                });
            });

            updateMetrics();
            buildFilterMenus();
            applyAllFilters();
        });

        // Manejo de Desplegables de Filtro
        window.toggleDropdown = function(id) {
            document.querySelectorAll('.dropdown-menu').forEach(el => {
                if(el.id !== id) el.classList.remove('active');
            });
            document.getElementById(id).classList.toggle('active');
        };

        // Cerrar menús flotantes al hacer clic afuera
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.dropdown-menu') && !e.target.closest('.fa-filter') && !e.target.closest('.action-dots-btn')) {
                document.querySelectorAll('.dropdown-menu').forEach(el => el.classList.remove('active'));
            }
        });

        window.filterMenuOptions = function(menuId, text) {
            const options = document.querySelectorAll(`#${menuId} .option-item`);
            options.forEach(opt => {
                const txt = opt.textContent.toLowerCase();
                opt.style.display = txt.includes(text.toLowerCase()) ? 'flex' : 'none';
            });
        };

        function buildFilterMenus() {
            buildMenuOptions('sheetOptions', 'sheet');
            buildMenuOptions('statusOptions', 'status');
            buildMenuOptions('followUpOptions', 'followUp');
        }

        function buildMenuOptions(containerId, colKey) {
            const uniqueVals = [...new Set(allCandidates.map(c => c[colKey]))].filter(Boolean).sort();
            const container = document.getElementById(containerId);
            
            container.innerHTML = `
                <label class="flex items-center gap-2 option-item cursor-pointer hover:text-indigo-400">
                    <input type="checkbox" checked onchange="toggleSelectAll('${colKey}', this.checked)" class="rounded bg-slate-900 border-slate-700">
                    <strong>(Select All)</strong>
                </label>
            ` + uniqueVals.map(val => `
                <label class="flex items-center gap-2 option-item cursor-pointer hover:text-indigo-400">
                    <input type="checkbox" value="${val}" class="col-check-${colKey} rounded bg-slate-900 border-slate-700" checked>
                    <span>${val}</span>
                </label>
            `).join('');
        }

        window.toggleSelectAll = function(colKey, isChecked) {
            document.querySelectorAll(`.col-check-${colKey}`).forEach(cb => cb.checked = isChecked);
        };

        window.applyColumnFilter = function(colKey) {
            const checkboxes = document.querySelectorAll(`.col-check-${colKey}:checked`);
            columnFilters[colKey] = Array.from(checkboxes).map(cb => cb.value);
            document.querySelectorAll('.dropdown-menu').forEach(el => el.classList.remove('active'));
            applyAllFilters();
        };

        window.sortData = function(colKey, direction) {
            allCandidates.sort((a, b) => {
                const valA = (a[colKey] || '').toLowerCase();
                const valB = (b[colKey] || '').toLowerCase();
                if (valA < valB) return direction === 'asc' ? -1 : 1;
                if (valA > valB) return direction === 'asc' ? 1 : -1;
                return 0;
            });
            document.querySelectorAll('.dropdown-menu').forEach(el => el.classList.remove('active'));
            applyAllFilters();
        };

        // Botones de Pestañas
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('text-indigo-400', 'border-b-2', 'border-indigo-500', 'active');
                    b.classList.add('text-slate-400');
                });
                btn.classList.add('text-indigo-400', 'border-b-2', 'border-indigo-500', 'active');
                btn.classList.remove('text-slate-400');
                
                activeTabSheet = btn.dataset.sheet;
                applyAllFilters();
            });
        });

        // Búsqueda General
        document.getElementById('globalSearch').addEventListener('input', applyAllFilters);
        document.getElementById('clearAllFiltersBtn').addEventListener('click', () => {
            document.getElementById('globalSearch').value = '';
            document.querySelectorAll('.dropdown-menu input[type="checkbox"]').forEach(cb => cb.checked = true);
            columnFilters = { sheet: [], status: [], followUp: [] };
            applyAllFilters();
        });

        function applyAllFilters() {
            const search = document.getElementById('globalSearch').value.toLowerCase();

            const filtered = allCandidates.filter(c => {
                const matchesTab = activeTabSheet === 'ALL' || c.sheet === activeTabSheet;
                const matchesSheetCol = columnFilters.sheet.length === 0 || columnFilters.sheet.includes(c.sheet);
                const matchesStatusCol = columnFilters.status.length === 0 || columnFilters.status.includes(c.status);
                const matchesFollowUpCol = columnFilters.followUp.length === 0 || columnFilters.followUp.includes(c.followUp);

                const matchesSearch = c.name.toLowerCase().includes(search) || 
                                      c.email.toLowerCase().includes(search) || 
                                      c.phone.toLowerCase().includes(search) ||
                                      c.notes.toLowerCase().includes(search);

                return matchesTab && matchesSheetCol && matchesStatusCol && matchesFollowUpCol && matchesSearch;
            });

            renderTable(filtered);
        }

        function formatDate(isoString) {
            if (!isoString) return 'Sin registro';
            const date = new Date(isoString);
            if (isNaN(date.getTime())) return 'Sin registro';
            return date.toLocaleString('es-SV', {
                day: '2-digit',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            document.getElementById('visibleCount').textContent = data.length;
            document.getElementById('totalCount').textContent = allCandidates.length;

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-500">No hay registros que coincidan con la selección.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map(c => `
                <tr class="hover:bg-slate-700/30 transition border-b border-slate-700/40">
                    <td class="py-3 px-4 font-medium text-white">${c.name}</td>
                    <td class="py-3 px-4 text-xs space-y-0.5">
                        <div class="text-slate-300"><i class="fa-regular fa-envelope mr-1 text-slate-500"></i>${c.email}</div>
                        <div class="text-slate-400"><i class="fa-solid fa-phone mr-1 text-slate-500"></i>${c.phone}</div>
                    </td>
                    <td class="py-3 px-4">
                        <span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                            ${c.sheet}
                        </span>
                    </td>
                    <td class="py-3 px-4">
                        <span class="bg-slate-700 text-slate-200 text-xs px-2.5 py-1 rounded-md font-medium">
                            ${c.status}
                        </span>
                    </td>
                    <td class="py-3 px-4">
                        <span class="bg-slate-800 text-slate-300 border border-slate-700 text-xs px-2.5 py-1 rounded-md">
                            ${c.followUp}
                        </span>
                    </td>
                    <td class="py-3 px-4 text-xs text-slate-300 max-w-xs truncate" title="${c.notes}">${c.notes}</td>
                    <td class="py-3 px-4 text-center space-x-2 relative">
                        <!-- WhatsApp Directo -->
                        <a href="https://wa.me/${cleanPhone(c.phone)}" target="_blank" class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600 hover:text-white transition" title="Enviar WhatsApp">
                            <i class="fa-brands fa-whatsapp text-sm"></i>
                        </a>

                        <!-- Botón 3 Puntos para Menú de Detalles y Acciones -->
                        <button onclick="toggleDropdown('actionMenu_${c.docId}')" class="action-dots-btn inline-flex items-center justify-center w-8 h-8 rounded-lg bg-slate-700/50 text-slate-300 hover:bg-slate-600 hover:text-white transition" title="Ver opciones">
                            <i class="fa-solid fa-ellipsis-vertical text-sm"></i>
                        </button>

                        <!-- Menú Flotante de Opciones e Historial -->
                        <div id="actionMenu_${c.docId}" class="dropdown-menu absolute right-2 top-full mt-1 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl p-3 w-64 z-50 text-left normal-case">
                            <div class="border-b border-slate-700 pb-2 mb-2">
                                <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Información de Registro</span>
                                <div class="text-xs text-slate-300 mt-1">
                                    <i class="fa-regular fa-clock text-indigo-400 mr-1"></i> <strong>Creado:</strong> ${formatDate(c.createdAt)}
                                </div>
                                ${c.updatedAt ? `
                                <div class="text-[11px] text-slate-400 mt-0.5">
                                    <i class="fa-solid fa-rotate-right text-slate-500 mr-1"></i> <strong>Actualizado:</strong> ${formatDate(c.updatedAt)}
                                </div>` : ''}
                            </div>

                            <div class="space-y-1">
                                <button onclick="openEditModal('${c.docId}')" class="w-full text-left text-xs py-1.5 px-2 rounded hover:bg-indigo-600 hover:text-white flex items-center gap-2 transition">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                    <span>Editar Candidato</span>
                                </button>
                                <button onclick="deleteCandidate('${c.docId}', '${c.name}')" class="w-full text-left text-xs py-1.5 px-2 rounded hover:bg-rose-600 hover:text-white text-rose-400 flex items-center gap-2 transition">
                                    <i class="fa-solid fa-trash-can"></i>
                                    <span>Eliminar Candidato</span>
                                </button>
                            </div>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function updateMetrics() {
            document.getElementById('metricTotal').textContent = allCandidates.length;
            document.getElementById('metricReferred').textContent = allCandidates.filter(c => c.sheet === 'Referred').length;
            document.getElementById('metricCold').textContent = allCandidates.filter(c => c.sheet === 'Cold').length;
            document.getElementById('metricOther').textContent = allCandidates.filter(c => ['Rejected by CONCENTRIX', 'No Referred'].includes(c.sheet)).length;
        }

        function cleanPhone(phone) {
            return phone.replace(/[^0-9]/g, '');
        }

        // Carga Masiva Excel
        document.getElementById('excelInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const batch = writeBatch(db);
                const nowIso = new Date().toISOString();

                workbook.SheetNames.forEach(sheetName => {
                    if (['Hoja1', 'Warn'].includes(sheetName)) return;

                    const worksheet = workbook.Sheets[sheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet);

                    jsonData.forEach(row => {
                        const name = row['<'] || row['Referidos'] || row['Nombre'] || 'Sin Nombre';
                        const email = row['Correo'] || '-';
                        const phone = row['Número'] || row['Numero'] || '-';
                        const status = row['Estatus'] || '-';
                        const followUp = row['Follow up?'] || '-';
                        const notes = row['Nota'] || row['Notas'] || '-';

                        const newRef = doc(candidatesCol);
                        batch.set(newRef, {
                            sheet: sheetName,
                            name: String(name).trim(),
                            email: String(email).trim(),
                            phone: String(phone).trim(),
                            status: String(status).trim(),
                            followUp: String(followUp).trim(),
                            notes: String(notes).trim(),
                            createdAt: nowIso,
                            updatedAt: nowIso
                        });
                    });
                });

                await batch.commit();
                alert("¡Excel cargado con éxito con fecha de creación!");
            };
            reader.readAsArrayBuffer(file);
        });

        // Guardar o Crear Candidato
        window.openAddModal = function() {
            currentEditingDocId = null;
            document.getElementById('modalTitle').textContent = 'Nuevo Candidato';
            document.getElementById('inputName').value = '';
            document.getElementById('inputEmail').value = '';
            document.getElementById('inputPhone').value = '+503 ';
            document.getElementById('inputStatus').value = '';
            document.getElementById('inputFollowUp').value = '';
            document.getElementById('inputNotes').value = '';
            document.getElementById('candidateModal').classList.remove('hidden');
        };

        window.openEditModal = function(docId) {
            const cand = allCandidates.find(c => c.docId === docId);
            if (!cand) return;
            currentEditingDocId = docId;
            document.getElementById('modalTitle').textContent = 'Editar Candidato';
            document.getElementById('inputName').value = cand.name;
            document.getElementById('inputEmail').value = cand.email;
            document.getElementById('inputPhone').value = cand.phone;
            document.getElementById('inputSheet').value = cand.sheet;
            document.getElementById('inputStatus').value = cand.status;
            document.getElementById('inputFollowUp').value = cand.followUp;
            document.getElementById('inputNotes').value = cand.notes;
            document.getElementById('candidateModal').classList.remove('hidden');
        };

        window.closeModal = function() {
            document.getElementById('candidateModal').classList.add('hidden');
        };

        window.saveCandidate = async function() {
            const nowIso = new Date().toISOString();
            
            if (currentEditingDocId) {
                await updateDoc(doc(db, "candidates", currentEditingDocId), {
                    name: document.getElementById('inputName').value,
                    email: document.getElementById('inputEmail').value,
                    phone: document.getElementById('inputPhone').value,
                    sheet: document.getElementById('inputSheet').value,
                    status: document.getElementById('inputStatus').value,
                    followUp: document.getElementById('inputFollowUp').value,
                    notes: document.getElementById('inputNotes').value,
                    updatedAt: nowIso
                });
            } else {
                await addDoc(candidatesCol, {
                    name: document.getElementById('inputName').value,
                    email: document.getElementById('inputEmail').value,
                    phone: document.getElementById('inputPhone').value,
                    sheet: document.getElementById('inputSheet').value,
                    status: document.getElementById('inputStatus').value,
                    followUp: document.getElementById('inputFollowUp').value,
                    notes: document.getElementById('inputNotes').value,
                    createdAt: nowIso,
                    updatedAt: nowIso
                });
            }

            closeModal();
        };

        window.deleteCandidate = async function(docId, name) {
            if (confirm(`¿Estás seguro de que deseas eliminar a ${name}?`)) {
                await deleteDoc(doc(db, "candidates", docId));
            }
        };
    </script>
</body>
</html>
